<!DOCTYPE html>
<html>

<head>

    <title>QR Analyzer | PhishEye AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>📷 QR Phishing Analyzer</h1>

    <p>
        Upload a QR code image and let
        PhishEye AI analyze the embedded URL
        for phishing threats.
    </p>

    <form
        action="/analyze-qr"
        method="POST"
        enctype="multipart/form-data"
    >

        <input
            type="file"
            name="qr_image"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Analyze QR Code
        </button>

    </form>

    <br>

    <a href="/">
        ← Back to Home
    </a>

</div>

</body>

</html>
